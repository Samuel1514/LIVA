<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- FontAwesome -->
    <title>User Login</title>
</head>
<body>
    <div class="login-container">
        <h2>User Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-button">Login</button>
            <div class="social-login">
                <!-- Google Login Button with Icon -->
                <button class="google-button" onclick="window.location.href='/login'">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Google_2015_logo.svg" alt="Google Logo" style="width:20px; height:20px; margin-right:5px;"> Login with Google
                </button>
                
                <!-- Facebook Login Button with Icon -->
                <button class="facebook-button">
                    <i class="fab fa-facebook-f"></i> Login with Facebook
                </button>
            </div>
        </form>
    </div>

    <script src="login.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
