<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>User Login</title>
</head>
<body>
    <div class="login-container">
        <h2>User Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-button">Login</button>
            <div class="social-login">
                <button class="google-button">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Google_2015_logo.svg" 
                         alt="Google Logo" style="width:20px; height:20px; margin-right:5px;">
                    Login with Google
                </button>
                <button class="facebook-button">
                    <i class="fab fa-facebook-f"></i> Login with Facebook
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxJlS35LSOe0h_v6Hzj4cOXhMAjRpr7oQ",
            authDomain: "login-liva-9266e.firebaseapp.com",
            projectId: "login-liva-9266e",
            storageBucket: "login-liva-9266e.appspot.com",
            messagingSenderId: "756068659500",
            appId: "1:756068659500:web:48e861a6c249ba95083c89"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        document.querySelector('.google-button').addEventListener('click', (e) => {
            e.preventDefault();
            signInWithPopup(auth, provider)
                .then((result) => {
                   
                    window.location.href = 'product.html'; // Redirect to product.html
                })
                .catch((error) => {
                    console.error('Login Failed:', error.message);
                });
        });
    </script>
</body>
</html>
