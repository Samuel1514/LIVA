<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li onclick="showFeature('manageUsers')">Manage Users</li>
                <li onclick="showFeature('viewReports')">View Reports</li>
                <li onclick="showFeature('manageContent')">Manage Content</li>
                <li onclick="showFeature('settings')">Settings</li>
                <li onclick="showFeature('notifications')">Notifications</li>
                <li onclick="showFeature('adminProfile')">Admin Profile</li>
            </ul>
        </aside>
        
        <main class="content">
            <h2 id="featureTitle">Admin Dashboard</h2>
            <div id="featureDescription">
                <p>Select an option from the left to perform administrative tasks.</p>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
